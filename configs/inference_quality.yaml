model_dir: models
base_model_dir: ${model_dir}/Wan2.1-T2V-14B
avatar_model_dir: ${model_dir}/Jogg-Avatar-14B

dtype: "bf16"
text_encoder_path: ${base_model_dir}/models_t5_umt5-xxl-enc-bf16.pth
image_encoder_path: null
dit_path: >-
  ${base_model_dir}/diffusion_pytorch_model-00001-of-00006.safetensors,
  ${base_model_dir}/diffusion_pytorch_model-00002-of-00006.safetensors,
  ${base_model_dir}/diffusion_pytorch_model-00003-of-00006.safetensors,
  ${base_model_dir}/diffusion_pytorch_model-00004-of-00006.safetensors,
  ${base_model_dir}/diffusion_pytorch_model-00005-of-00006.safetensors,
  ${base_model_dir}/diffusion_pytorch_model-00006-of-00006.safetensors
vae_path: ${base_model_dir}/Wan2.1_VAE.pth
wav2vec_path: ${model_dir}/wav2vec2-base-960h
exp_path: ${avatar_model_dir}

# Tested on two RTX 4090 GPUs with sp_size=2. Set both sp_size and
# --nproc_per_node to 1 for a single-GPU run.
num_persistent_param_in_dit: 4000000000
reload_cfg: true
sp_size: 2

seed: 42
image_sizes_720: [[400, 720], [720, 720], [720, 400]]
image_sizes_1280: [[720, 1280], [1280, 720]]
max_hw: 1280
max_tokens: 30000
seq_len: 200
overlap_frame: 13
guidance_scale: 4.5
audio_scale:
num_steps: 20
fps: 25
sample_rate: 16000
negative_prompt: "Vivid color tones, background/camera moving quickly, screen switching, subtitles and special effects, mutation, overexposed, static, blurred details, subtitles, style, work, painting, image, still, overall grayish, worst quality, low quality, JPEG compression residue, ugly, incomplete, extra fingers, poorly drawn hands, poorly drawn face, deformed, disfigured, malformed limbs, fingers merging, motionless image, chaotic background, three legs, crowded background with many people, walking backward"
silence_duration_s: 0.3
use_fsdp: false
tea_cache_l1_thresh: 0
